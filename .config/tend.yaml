bot_name: worktrunk-bot
setup:
- uses: ./.github/actions/tend-setup
# `setup:` runs as `runner`, so what it installs into the runner's home never
# reaches the agent — and from tend 0.2.5 the sandbox denies reads there
# outright, so a line copying a binary out of it fails the whole lifecycle
# before the harness starts (see "Sandbox toolchain" in .github/CLAUDE.md).
# Only pre-commit is left: it installs into the sandbox's own home, where uv's
# shim shebang resolves, and needs no runner-owned file to do it. `cargo-insta`,
# `cargo-nextest`, `nu` and `nix` all take the system-location route in
# `tend-setup` instead and need no line here. The probe still asserts all five:
# sandbox-setup runs the block under `bash -eo pipefail`, so a tool that goes
# missing fails the job and files a tend-outage issue naming it.
sandbox_setup:
- mkdir -p ~/.local/bin
- uv tool install --quiet pre-commit
- 'for t in cargo-insta cargo-nextest pre-commit nu nix; do command -v "$t" >/dev/null || { echo "::error::tend sandbox is missing $t; see Sandbox toolchain in .github/CLAUDE.md"; exit 1; }; done'
secrets:
  allowed:
  - CODECOV_TOKEN
workflows:
  ci-fix:
    watched_workflows:
    - ci
    - coverage
    # `affected-tests` is continue-on-error, so watching this workflow only
    # signs Tend up for `collect-affected` failures — a stale DB degrades
    # selection on every later PR, so it is worth fixing.
    - affected
    - publish-docs
    # nightly hosts `full-tests` (the cargo-affected safety net), so a red
    # nightly is actionable: Tend fixes it instead of leaving main's gaps
    # uncaught. Tend watches at the workflow level, so this also signs Tend up
    # for the other nightly jobs (minimal-versions, nix-flake, udeps) — an
    # accepted trade for keeping the safety net green.
    - nightly
