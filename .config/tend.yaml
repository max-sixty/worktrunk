bot_name: worktrunk-bot
setup:
- uses: ./.github/actions/tend-setup
# tend 0.2.14 deprecated `sandbox_setup:` and runs its commands as an ordinary
# `runner` step after `setup:`; the agent then sees what they install through a
# copy-on-write view of the job's home (see "Sandbox toolchain" in
# .github/CLAUDE.md). #4222 kept the key so a release reverting 0.2.14 would
# still find it, so this block outliving its original rationale is deliberate,
# not drift.
#
# What that rationale was: `setup:` ran as `runner` and the sandbox denied
# reads under the runner's home, so pre-commit had to be installed from here,
# into the sandbox's own home. It now duplicates `tend-setup`'s own pre-commit
# step and goes when the key does. The probe is what still earns its place:
# the block runs under `bash -eo pipefail`, so a tool that goes missing fails
# the job and files a tend-outage issue naming it. It asserts all five because
# all five are what the pre-merge gate needs, whichever step installed them.
sandbox_setup:
- mkdir -p ~/.local/bin
- uv tool install --quiet pre-commit
- 'for t in cargo-insta cargo-nextest pre-commit nu nix; do command -v "$t" >/dev/null || { echo "::error::tend sandbox is missing $t; see Sandbox toolchain in .github/CLAUDE.md"; exit 1; }; done'
secrets:
  allowed:
  - CODECOV_TOKEN
workflows:
  ci-fix:
    watched_workflows:
    - ci
    - coverage
    # `affected-tests` is continue-on-error, so watching this workflow only
    # signs Tend up for `collect-affected` failures — a stale DB degrades
    # selection on every later PR, so it is worth fixing.
    - affected
    - publish-docs
    # nightly hosts `full-tests` (the cargo-affected safety net), so a red
    # nightly is actionable: Tend fixes it instead of leaving main's gaps
    # uncaught. Tend watches at the workflow level, so this also signs Tend up
    # for the other nightly jobs (minimal-versions, nix-flake, udeps) — an
    # accepted trade for keeping the safety net green.
    - nightly
