name: star-history-token-probe
# Answers one question: can the built-in Actions token read this repo's
# stargazers? GitHub limits that data to the repo's admins and collaborators,
# and whether an Actions token counts as either is undocumented — so
# star-history.yaml carries a STARGAZERS_TOKEN secret on the assumption that it
# does not. If this probe says otherwise, drop the secret and its environment.
#
# Two jobs differing only in `contents` permission, because star-history.com
# tells repo owners the endpoint "requires contents write access — that's how
# GitHub verifies you're a collaborator". Running read against write tests that
# claim on an installation token directly.
#
# Disposable: delete this file once the answer is recorded in star-history.yaml.
#
# Runner versions pinned; see ci.yaml header comment for rationale.

on:
  # Runs on pushes to the branch holding it, so the answer comes back from
  # pushing that branch rather than from merging an experiment to main —
  # `workflow_dispatch` alone would need this file on the default branch first.
  # A branch filter rather than a `paths` one because the first push of a new
  # branch has no remote predecessor to diff against, and whether `paths` then
  # matches is undocumented; a probe that silently declines to run is worse
  # than one that runs twice.
  push:
    branches: [starchart]
  workflow_dispatch:

jobs:
  contents-read:
    name: github.token with contents read
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 🔎 Probe
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: contents-read
        run: bash .github/workflows/star-history-token-probe.sh

  contents-write:
    name: github.token with contents write
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 🔎 Probe
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: contents-write
        run: bash .github/workflows/star-history-token-probe.sh
