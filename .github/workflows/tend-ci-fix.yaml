name: tend-ci-fix
on:
  workflow_run:
    workflows: ["ci", "coverage", "affected", "publish-docs", "nightly"]
    types: [completed]
    branches: ["main"]

jobs:
  fix-ci:
    # By default, only failed runs start a ci-fix session.
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false' && github.event.workflow_run.conclusion == 'failure'
    concurrency:
      # A red branch fails every push that follows, each on its own commit, so
      # one session per branch — not per commit — is what collapses the burst.
      # The watched workflow and the run's event are in the key too: a red
      # `publish-site` must not starve behind a stream of red `ci`, and a
      # pending scheduled failure must not be replaced by the next push
      # failure on the same branch. Never cancel — a running session may
      # already have pushed a branch or opened a PR. Default queue depth is
      # right: within each group, the newest failure replaces the pending one.
      group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup
      - run: for t in cargo-insta cargo-nextest pre-commit nu nix; do command -v "$t" >/dev/null || { echo "::error::tend setup is missing $t; see Sandbox toolchain in .github/AGENTS.md"; exit 1; }; done

      - uses: max-sixty/tend/codex@0.3.14
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          merge: restricted
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          bot_name: worktrunk-bot
          model: gpt-6-sol
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            $ci-fix ${{ github.event.workflow_run.id }}
            - Run URL: ${{ github.event.workflow_run.html_url }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Commit message: ${{ github.event.workflow_run.head_commit.message }}
