name: star-history
# Regenerates the README's star-history chart. GitHub restricted a repository's
# stargazers to its admins and collaborators in mid-2026, so every hosted chart
# service renders an error image — a service is nobody's collaborator. We can
# still read our own, so the chart is built here from our own query.
#
# The chart and its underlying series are force-pushed to the orphan
# `star-history` branch: the README points at that branch's raw URL, main stays
# free of weekly bot commits (ci.yaml runs the full matrix on every push to
# main), and each run replaces the branch rather than growing it.
#
# Runner versions pinned; see ci.yaml header comment for rationale.

on:
  schedule:
    # Weekly, Monday 06:11 UTC. Off-peak minute, per nightly.yaml.
    - cron: '11 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    permissions:
      # Covers both halves of the job, and `write` is load-bearing for each.
      # Pushing the orphan branch needs it, and so does *reading* stargazers:
      # write access to the repo is what GitHub accepts as proof of being a
      # collaborator. Measured rather than assumed — the same built-in token
      # gets 403 from both REST and GraphQL under `contents: read` and reads
      # the full history under `contents: write`. So no PAT and no secret:
      # dropping to `read` would break the fetch, not just the push.
      contents: write

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7

      - name: 📈 Render chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/star-history.py

      - name: 🚀 Publish to the star-history branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Leaves the two ignored outputs in place, drops everything else.
          git switch --orphan star-history
          git add --force star-history.csv star-history.svg
          git commit -m "Star history through $(date -u +%Y-%m-%d)"
          git push --force origin star-history
