name: tend-nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  nightly:
    if: github.repository_owner == 'max-sixty'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup

      - uses: max-sixty/tend/claude@0.1.20
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: worktrunk-bot
          model: opus
          sandbox_setup: |
            mkdir -p ~/.local/bin
            install -m755 /home/runner/.cargo-install/cargo-insta/bin/cargo-insta ~/.local/bin/
            install -m755 /home/runner/.cargo-install/cargo-nextest/bin/cargo-nextest ~/.local/bin/
            uv tool install --quiet pre-commit
            for t in cargo-insta cargo-nextest pre-commit nu nix; do command -v "$t" >/dev/null || { echo "::error::tend sandbox is missing $t; see Sandbox toolchain in .github/CLAUDE.md"; exit 1; }; done
          prompt: |
            /tend-ci-runner:nightly
