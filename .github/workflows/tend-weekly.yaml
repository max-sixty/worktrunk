name: tend-weekly
on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

jobs:
  weekly:
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup
      - run: for t in cargo-insta cargo-nextest pre-commit nu nix; do command -v "$t" >/dev/null || { echo "::error::tend setup is missing $t; see Sandbox toolchain in .github/AGENTS.md"; exit 1; }; done

      - uses: max-sixty/tend/claude@0.3.4
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          merge: restricted
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: worktrunk-bot
          model: opus
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            /tend-ci-runner:weekly
