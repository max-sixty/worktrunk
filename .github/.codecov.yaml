comment: false

# `cargo llvm-cov` reports only `src/`, so this is a guard rather than a live
# filter. It has to be `tests/**`: codecov compiles `**/tests/**` to
# `.*/tests/.*`, which needs a leading directory and so misses `tests/` itself.
ignore:
  - "tests/**"

coverage:
  status:
    project:
      default:
        removed_code_behavior: adjust_base
        # This disables report a success/failure. That's not helpful on `main`
        # and we get the success/failure from the patch status on PRs.
        informational: true

    patch:
      default:
        only_pulls: true
