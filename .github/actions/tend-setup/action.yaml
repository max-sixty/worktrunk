name: tend setup
description: Install cargo tools and test shells for the tend workflows

inputs:
  install-cargo-tools:
    description: Install cargo-insta and cargo-nextest
    default: "true"
  install-shells:
    description: Install zsh, fish, and nushell for shell integration tests
    default: "true"

runs:
  using: composite
  steps:
    # No rust-cache step here, and so no CARGO*/RUST* env block above one to
    # match its key. The reason was tend 0.2.5–0.2.13: the agent worked in a
    # disposable /tmp clone and the sandbox denied reads under the runner's
    # home, so a restored `~/.cargo` and `<runner checkout>/target` were both
    # unreachable and at the wrong path — the restore warmed nothing and cost
    # the download in all eight workflows. 0.2.14 put the agent on the job's
    # own checkout and home, so both are now reachable at the path a restore
    # writes them to, and tend sessions still build cold only because nothing
    # restores them. Whether a cache pays for itself here is a measurement
    # (max-sixty/tend#1198), no longer a blocked one.

    # These `cargo-install` steps write `$HOME/.cargo-install/<crate>/bin` —
    # the root the publish step below hardcodes — and from tend 0.2.14 the
    # agent reads that directly, with the entry ahead of /usr/local/bin on its
    # PATH. The publish was the only route while the sandbox denied reads under
    # the runner's home (0.2.5–0.2.13) and is now a second copy of the same two
    # binaries. It stays as a system-path fallback if that isolation returns
    # (see "Sandbox toolchain" in .github/AGENTS.md).
    # Swapping these steps for an action with a different layout breaks the
    # publish step, which hardcodes this root; update both sides.
    - name: Install cargo-insta
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-insta
        version: "=1.49.0"

    - name: Install cargo-nextest
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.152"

    - name: Publish the cargo tools to a system location
      if: inputs.install-cargo-tools == 'true'
      shell: bash
      # `sudo` is what makes this a runner-side step: the agent has none, which
      # is why it cannot do this hand-off for itself.
      run: |
        for crate in cargo-insta cargo-nextest; do
          sudo install -m755 "$HOME/.cargo-install/$crate/bin/$crate" /usr/local/bin/
        done

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        cache-dependency-glob: .pre-commit-config.yaml

    - name: Install pre-commit
      shell: bash
      run: uv tool install pre-commit

    - name: Install shells (zsh, fish)
      if: inputs.install-shells == 'true'
      shell: bash
      # Bounded on purpose: an unreachable mirror leaves apt in a retry loop
      # that never terminates, and this step runs before the tend action, so
      # nothing else caps it — five jobs on 2026-08-18/19 sat here until
      # GitHub's 360-minute job cap killed them, one of them the only review
      # #3843 was ever going to get. `timeout-minutes` isn't accepted on a
      # composite-action step, hence `timeout(1)`. A healthy update takes
      # ~15 s, so 5 min is headroom, not a budget. `-k 30` escalates to
      # SIGKILL, so an apt — or one of the acquire-method children it spawns —
      # that ignores the initial SIGTERM can't run the step back out to the
      # cap; expiry fails the step in minutes instead of hours either way
      # (124 when SIGTERM lands it, 137 after the kill).
      run: |
        sudo timeout -k 30 300 apt-get update
        sudo timeout -k 30 300 apt-get install -y zsh fish

    # The gate's `insta` step runs `--all-features`, which turns on
    # `shell-integration-tests` — that needs `nu` as much as zsh and fish, and
    # two tests `.expect()` it outright. `setup-nu` installs into
    # /opt/hostedtoolcache, which the agent has reached under every sandbox
    # arrangement so far (see "Sandbox toolchain" in .github/AGENTS.md). Level
    # with `test-setup`'s pin.
    - name: Install nushell
      if: inputs.install-shells == 'true'
      uses: hustcer/setup-nu@v3
      with:
        version: '0.117.0'
