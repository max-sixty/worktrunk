name: tend setup
description: Install cargo tools, test shells, and Nix for the tend workflows

inputs:
  install-cargo-tools:
    description: Install cargo-insta and cargo-nextest
    default: "true"
  install-shells:
    description: Install zsh, fish, and nushell for shell integration tests
    default: "true"

runs:
  using: composite
  steps:
    # No rust-cache step here, and so no CARGO*/RUST* env block above one to
    # match its key. From tend 0.2.5 the agent works in a disposable /tmp clone
    # instead of the runner's checkout, and the sandbox denies reads under the
    # runner's home, so a restored `~/.cargo` and `<runner checkout>/target`
    # are both unreachable and at the wrong path — the restore warmed nothing
    # and cost the download in all eight workflows. Tend sessions build cold
    # until there is a supported way to warm the agent's own tree
    # (max-sixty/tend#1198). Restoring here again needs that to land first.

    # The cargo tools reach the agent through `/usr/local/bin`, not through the
    # runner's home: these `cargo-install` steps write
    # `$HOME/.cargo-install/<crate>/bin` — the root this action hardcodes — and
    # the sandbox denies that whole subtree, so `.config/tend.yaml` can no
    # longer copy them across from `sandbox_setup:`. A system location crosses
    # verbatim instead, the route `nu` and `nix` already take (see "Sandbox
    # toolchain" in .github/CLAUDE.md). Swapping these steps for an action with
    # a different layout, or dropping the publish step below, breaks every tend
    # workflow at `.config/tend.yaml`'s probe; update both sides.
    - name: Install cargo-insta
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-insta
        version: "=1.48.0"

    - name: Install cargo-nextest
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.143"

    - name: Publish the cargo tools to a system location
      if: inputs.install-cargo-tools == 'true'
      shell: bash
      # `sudo` is what makes this a runner-side step: the agent has none, which
      # is why it cannot do this hand-off for itself.
      run: |
        for crate in cargo-insta cargo-nextest; do
          sudo install -m755 "$HOME/.cargo-install/$crate/bin/$crate" /usr/local/bin/
        done

    - name: Install uv
      uses: astral-sh/setup-uv@v7.6.0
      with:
        cache-dependency-glob: .pre-commit-config.yaml

    - name: Install pre-commit
      shell: bash
      run: uv tool install pre-commit

    - name: Install shells (zsh, fish)
      if: inputs.install-shells == 'true'
      shell: bash
      # Bounded on purpose: an unreachable mirror leaves apt in a retry loop
      # that never terminates, and this step runs before the tend action, so
      # nothing else caps it — five jobs on 2026-08-18/19 sat here until
      # GitHub's 360-minute job cap killed them, one of them the only review
      # #3843 was ever going to get. `timeout-minutes` isn't accepted on a
      # composite-action step, hence `timeout(1)`. A healthy update takes
      # ~15 s, so 5 min is headroom, not a budget. `-k 30` escalates to
      # SIGKILL, so an apt — or one of the acquire-method children it spawns —
      # that ignores the initial SIGTERM can't run the step back out to the
      # cap; expiry fails the step in minutes instead of hours either way
      # (124 when SIGTERM lands it, 137 after the kill).
      run: |
        sudo timeout -k 30 300 apt-get update
        sudo timeout -k 30 300 apt-get install -y zsh fish

    # The gate's `insta` step runs `--all-features`, which turns on
    # `shell-integration-tests` — that needs `nu` as much as zsh and fish, and
    # two tests `.expect()` it outright. `setup-nu` installs into a system
    # location, so the agent inherits it (see "Sandbox toolchain" in
    # .github/CLAUDE.md) with no `sandbox_setup:` line the way the runner-home
    # installs above need. Level with `test-setup`'s pin.
    - name: Install nushell
      if: inputs.install-shells == 'true'
      uses: hustcer/setup-nu@v3
      with:
        version: '0.115.1'

    # Nix, for the weekly toolchain bump's `flake.lock` refresh. The sandboxed
    # agent can't install it: that user has no sudo, so it can't create /nix.
    # `install-nix-action` runs as `runner` and puts
    # /nix/var/nix/profiles/default/bin on $GITHUB_PATH — a system path, so the
    # agent inherits `nix` on the same rule as `nu` above.
    #
    # Every tend workflow installs it, though only the weekly one runs `nix`.
    # `.config/tend.yaml`'s probe asserts `nix` from inside the sandbox and
    # runs everywhere, so gating this step to the weekly workflow would fail
    # the rest. It costs 4 s of the action's ~50 s.
    #
    # The multi-user daemon install is what carries it across, so the ~1 s
    # `nixbuild/nix-quick-install-action` is no substitute: it hands /nix to
    # the runner and puts only $HOME/.nix-profile/bin on $GITHUB_PATH, which
    # the /home/runner rewrite drops. Here root owns /nix and the store is
    # reached through the daemon.
    #
    # Reaching the daemon is what the agent can no longer do. From tend 0.2.5
    # the sandbox blocks `socket(AF_UNIX, …)` outright, so connecting to
    # /nix/var/nix/daemon-socket/socket fails with EPERM and the weekly job's
    # `nix flake update` cannot run — it needs an upstream lever
    # (max-sixty/tend#1197). `command -v nix` still resolves, so the probe
    # below stays green and the gap surfaces only in that one job. The install
    # stays because it is the half of the route this repo owns, and because
    # `nix` still works for anything running as `runner`.
    #
    # Caching doesn't apply. Of the 4 s, the binary tarball is about half; the
    # rest creates the nixbld users, /etc/nix and the daemon unit, which no
    # restored /nix reproduces. Caching the store instead would serve only the
    # weekly job's flake fetches, at the cost of a restore in every workflow.
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Strip the job token from /etc/nix/nix.conf
      shell: bash
      # The step above writes `access-tokens = github.com=<job token>` into
      # world-readable /etc/nix/nix.conf whenever it can see a token, and its
      # action.yml passes `GITHUB_TOKEN: ${{ github.token }}` unconditionally.
      # `github_access_token: ""` doesn't suppress it; install-nix.sh falls
      # through to the job token, which on tend-weekly carries `contents:
      # write`. Deleting the line here is enough, because the sandbox user
      # doesn't exist until the tend action runs.
      #
      # Nothing is lost: tend's proxy overwrites `Authorization` on every
      # sandbox request to github.com, codeload.github.com, and api.github.com
      # with the bot's token, so flake fetches still authenticate.
      #
      # The `grep` runs under sudo like the `sed`, though the file is
      # world-readable today: `grep` exits 2 when it can't read a file, and an
      # `if` condition takes that as "no match", so a check that couldn't run
      # would report success. After `sed -i` succeeds, root can read the file
      # by construction.
      run: |
        sudo sed -i '/^access-tokens/d' /etc/nix/nix.conf
        if sudo grep -q 'access-tokens' /etc/nix/nix.conf; then
          echo "::error::a GitHub token survived in /etc/nix/nix.conf"
          exit 1
        fi
