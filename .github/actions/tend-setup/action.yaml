name: tend setup
description: Install cargo tools, Rust cache, and test shells for the tend workflows

inputs:
  install-cargo-tools:
    description: Install cargo-insta and cargo-nextest
    default: "true"
  install-shells:
    description: Install zsh and fish for shell integration tests
    default: "true"

runs:
  using: composite
  steps:
    # Above the cache step on purpose: rust-cache hashes the CARGO*/RUST* vars
    # visible at its own step into the key, so these have to be set first, and
    # have to match what ci.yaml's workflow `env:` block gives the jobs that
    # write the shared cache (see "Build environment" in .github/CLAUDE.md).
    - name: Set build environment
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-C debuginfo=0" >> "$GITHUB_ENV"

    - name: Install cargo-insta
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-insta
        version: "=1.48.0"

    - name: Install cargo-nextest
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.143"

    - name: "\U0001F4B0 Cache"
      uses: Swatinem/rust-cache@v2
      with:
        # Restore the shared cache `test-setup`'s jobs publish from main; never
        # save (tend jobs would deposit single-use entries against the 10 GB
        # repo cap). Each field has to match what those jobs compute or the
        # restore silently misses, as the old `hashFiles('Cargo.lock')` prefix
        # and job-name shared-key did.
        cache-bin: false
        prefix-key: v1-rust
        shared-key: shared
        save-if: false

    - name: Install uv
      uses: astral-sh/setup-uv@v7.6.0
      with:
        cache-dependency-glob: .pre-commit-config.yaml

    - name: Install pre-commit
      shell: bash
      run: uv tool install pre-commit

    - name: Install shells (zsh, fish)
      if: inputs.install-shells == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y zsh fish
