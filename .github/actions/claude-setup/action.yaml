name: Claude CI Setup
description: Install cargo tools and test shells for Claude CI workflows

inputs:
  install-cargo-tools:
    description: Install cargo-insta and cargo-nextest
    default: "true"
  install-shells:
    description: Install zsh and fish for shell integration tests
    default: "true"

runs:
  using: composite
  steps:
    - name: Install cargo-insta
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-insta
        version: "=1.48.0"

    - name: Install cargo-nextest
      if: inputs.install-cargo-tools == 'true'
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.143"

    # Deliberately no rust-cache step. The one that used to sit here keyed on
    # `prefix-key: hashFiles('Cargo.lock')` with no `shared-key`, while the
    # repo's only writer (`test` in ci.yaml, via test-setup) writes
    # `v1-rust`/`shared` — so it never matched anything and every tend job
    # paid ~13s to be told "No cache found."
    #
    # Adding one back takes more than those two keys. `Set build environment`
    # below would have to move *above* it (rust-cache hashes the CARGO*/RUST*
    # vars visible at its own step — see "Build environment" in
    # .github/CLAUDE.md) while still exporting RUSTDOCFLAGS afterwards, since
    # no cache writer sets that one. Getting any of the three wrong reproduces
    # the silent miss this removal cleared.

    - name: Install uv
      uses: astral-sh/setup-uv@v7.6.0
      with:
        cache-dependency-glob: .pre-commit-config.yaml

    - name: Install pre-commit
      shell: bash
      run: uv tool install pre-commit

    - name: Install shells (zsh, fish)
      if: inputs.install-shells == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y zsh fish

    - name: Set build environment
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-C debuginfo=0" >> "$GITHUB_ENV"
        echo "RUSTDOCFLAGS=-Dwarnings" >> "$GITHUB_ENV"
