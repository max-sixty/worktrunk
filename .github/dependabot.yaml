version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore: "
    # Bump all patch versions of rust dependencies as a single PR
    groups:
      patch:
        update-types:
          - patch
    # Exclude labels due to https://github.com/dependabot/dependabot-core/issues/7645#issuecomment-1986212847
    labels: []

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore: "
    schedule:
      interval: daily
    labels: []

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore: "
    groups:
      docs-site:
        patterns:
          - "*"
    ignore:
      # `@astrojs/check` declares `peer typescript@"^5.0.0 || ^6.0.0"`, so a
      # TypeScript 7 lockfile makes `npm ci` fail ERESOLVE and takes the docs
      # build down. Drop this once `@astrojs/check` accepts `^7`.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
    labels: []
